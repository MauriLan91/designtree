[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MauriLan91/designtree"
rust-version = "1.85"

[workspace.dependencies]
designtree-core = { path = "crates/designtree-core" }
designtree-bindings = { path = "crates/designtree-bindings" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fancy-regex = "0.14"
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
ts-rs = "12"
walkdir = "2"

# Schema validation runs while the user edits, also in `tauri dev`; without
# optimization it is several times slower.
[profile.dev.package.designtree-bindings]
opt-level = 2
[profile.dev.package.jsonschema]
opt-level = 2
[profile.dev.package.referencing]
opt-level = 2
[profile.dev.package.fancy-regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
