[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MauriLan91/designtree"
rust-version = "1.80"

[workspace.dependencies]
designtree-core = { path = "crates/designtree-core" }
designtree-bindings = { path = "crates/designtree-bindings" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
walkdir = "2"
