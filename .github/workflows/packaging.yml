name: Packaging

# Builds the Linux packages on changes that can break them. The release
# workflow builds the same from a tag.
on:
  pull_request:
    paths:
      - packaging/**
      - app/src-tauri/**
      - app/package.json
      - app/package-lock.json
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/packaging.yml
      - .github/workflows/linux-packages.yml
      - .github/actions/linux-bundles/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/linux-packages.yml
    with:
      arch-mode: git
      arch-ref: ${{ github.sha }}
