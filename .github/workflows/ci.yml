name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev device-tree-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist directory to exist.
      - run: mkdir -p app/dist
      - run: scripts/bump-version.sh --check
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
        env:
          DESIGNTREE_REQUIRE_DTC: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # G1: import, export and recompile a fixed corpus of kernel board files and
  # compare with the kernel build. Fails below DESIGNTREE_G1_THRESHOLD percent.
  g1-corpus:
    runs-on: ubuntu-latest
    env:
      KERNEL_TAG: v7.3
      DESIGNTREE_G1_THRESHOLD: 90
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kernel devicetree sources
        id: kernel
        uses: actions/cache@v6
        with:
          path: ~/linux-g1
          # The key names everything that decides what the checkout holds.
          key: linux-g1-${{ env.KERNEL_TAG }}-${{ hashFiles('scripts/fetch-kernel-dts.sh') }}
      - name: Sparse checkout of the kernel at the pinned tag
        if: steps.kernel.outputs.cache-hit != 'true'
        run: scripts/fetch-kernel-dts.sh ~/linux-g1
      - name: Run the corpus
        shell: bash
        env:
          DESIGNTREE_REQUIRE_DTC: 1
        run: |
          export DESIGNTREE_LINUX_SRC="$HOME/linux-g1"
          cargo test --release -p designtree-core --test g1_corpus -- --ignored --nocapture | tee g1.log
      - name: Report the pass rate
        if: always()
        shell: bash
        run: |
          [ -f g1.log ] || exit 0
          {
            echo "### G1 round-trip corpus (kernel $KERNEL_TAG)"
            grep '^G1:' g1.log || echo "The corpus did not finish."
            if grep -q '^FAIL' g1.log; then
              echo
              echo '```'
              grep '^FAIL' g1.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  g3-corpus:
    runs-on: ubuntu-latest
    env:
      KERNEL_TAG: v7.3
      # dt-schema at the version of the embedded core schemas
      # (crates/designtree-bindings/dtschema).
      DTSCHEMA_VERSION: "2026.9"
      DESIGNTREE_G3_THRESHOLD: 90
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "dtschema==$DTSCHEMA_VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kernel devicetree sources
        id: kernel
        uses: actions/cache@v6
        with:
          path: ~/linux-g1
          key: linux-g1-${{ env.KERNEL_TAG }}-${{ hashFiles('scripts/fetch-kernel-dts.sh') }}
      - name: Sparse checkout of the kernel at the pinned tag
        if: steps.kernel.outputs.cache-hit != 'true'
        run: scripts/fetch-kernel-dts.sh ~/linux-g1
      - name: Run the corpus
        shell: bash
        run: |
          export DESIGNTREE_LINUX_SRC="$HOME/linux-g1"
          cargo test --release -p designtree-cli --test g3_corpus -- --ignored --nocapture | tee g3.log
      - name: Report the recall
        if: always()
        shell: bash
        run: |
          [ -f g3.log ] || exit 0
          {
            echo "### G3 seeded-error corpus (kernel $KERNEL_TAG, dt-schema $DTSCHEMA_VERSION)"
            grep '^G3:' g3.log || echo "The corpus did not finish."
            echo
            grep '^|' g3.log || true
            if grep -qE '^(MISS|ERROR)' g3.log; then
              echo
              echo '```'
              grep -E '^(MISS|ERROR|        )' g3.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # G5: time the backend and the canvas on a generated 1,000-node board and
  # compare with the last run on main. Reports only: shared runners are too
  # noisy for a threshold, and have no GPU for the canvas.
  g5-bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Time the backend
        run: |
          cargo build --release -p designtree-cli
          target/release/designtree bench --nodes 1000 --runs 9 --json --design g5-design.json > g5-backend.json
      - name: Build the front end
        working-directory: app
        run: |
          npm ci
          npm run build
          npm install --no-save "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Time the canvas
        working-directory: app
        run: node bench/g5.mjs ../g5-design.json --out ../g5-canvas.json
      - name: Time the long lists
        working-directory: app
        run: |
          ../target/release/designtree bench --nodes 5000 --runs 1 --json --design ../g5-lists-design.json > /dev/null
          node bench/lists.mjs ../g5-lists-design.json --problems 8000 --out ../g5-lists.json
      - name: Fetch the last report from main
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: ci.yml
          branch: main
          name: g5
          path: previous
          if_no_artifact_found: warn
      - name: Report
        run: node app/bench/g5-report.mjs g5-backend.json g5-canvas.json g5-lists.json g5.json previous/g5.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: g5
          path: g5.json
          retention-days: 90

  # US-4.5: drive the real app under tauri-driver and check every UI element
  # by what it does. Fails on a broken element, a registry command without a
  # test, or a known bug (e2e/known.mjs) that passes again.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri, WebKit driver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev device-tree-compiler xvfb
          # WebKitWebDriver: webkitgtk-webdriver since Ubuntu 25.04, webkit2gtk-driver before.
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          which WebKitWebDriver
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cargo install tauri-driver --locked
      - name: Build the app with the E2E hook
        working-directory: app
        run: |
          npm ci
          npx tauri build --no-bundle
        env:
          VITE_E2E: 1
      - name: Run the suite
        working-directory: app
        run: xvfb-run -a -s "-screen 0 1400x900x24" node e2e/run.mjs --app ../target/release/designtree-app
      - name: Report
        if: always()
        run: if [ -f app/e2e/report/report.md ]; then cat app/e2e/report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: app/e2e/report
          retention-days: 30
