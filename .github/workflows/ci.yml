name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev device-tree-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist directory to exist.
      - run: mkdir -p app/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
        env:
          DESIGNTREE_REQUIRE_DTC: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  # G1: import, export and recompile a fixed corpus of kernel board files and
  # compare with the kernel build. Fails below DESIGNTREE_G1_THRESHOLD percent.
  g1-corpus:
    runs-on: ubuntu-latest
    env:
      KERNEL_TAG: v7.3
      DESIGNTREE_G1_THRESHOLD: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kernel devicetree sources
        id: kernel
        uses: actions/cache@v4
        with:
          path: ~/linux-g1
          # The key names everything that decides what the checkout holds.
          key: linux-g1-${{ env.KERNEL_TAG }}-${{ hashFiles('scripts/fetch-kernel-dts.sh') }}
      - name: Sparse checkout of the kernel at the pinned tag
        if: steps.kernel.outputs.cache-hit != 'true'
        run: scripts/fetch-kernel-dts.sh ~/linux-g1
      - name: Run the corpus
        shell: bash
        env:
          DESIGNTREE_REQUIRE_DTC: 1
        run: |
          export DESIGNTREE_LINUX_SRC="$HOME/linux-g1"
          cargo test --release -p designtree-core --test g1_corpus -- --ignored --nocapture | tee g1.log
      - name: Report the pass rate
        if: always()
        shell: bash
        run: |
          [ -f g1.log ] || exit 0
          {
            echo "### G1 round-trip corpus (kernel $KERNEL_TAG)"
            grep '^G1:' g1.log || echo "The corpus did not finish."
            if grep -q '^FAIL' g1.log; then
              echo
              echo '```'
              grep '^FAIL' g1.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  g3-corpus:
    runs-on: ubuntu-latest
    env:
      KERNEL_TAG: v7.3
      # dt-schema at the version of the embedded core schemas
      # (crates/designtree-bindings/dtschema).
      DTSCHEMA_VERSION: "2026.9"
      DESIGNTREE_G3_THRESHOLD: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dtschema==$DTSCHEMA_VERSION"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kernel devicetree sources
        id: kernel
        uses: actions/cache@v4
        with:
          path: ~/linux-g1
          key: linux-g1-${{ env.KERNEL_TAG }}-${{ hashFiles('scripts/fetch-kernel-dts.sh') }}
      - name: Sparse checkout of the kernel at the pinned tag
        if: steps.kernel.outputs.cache-hit != 'true'
        run: scripts/fetch-kernel-dts.sh ~/linux-g1
      - name: Run the corpus
        shell: bash
        run: |
          export DESIGNTREE_LINUX_SRC="$HOME/linux-g1"
          cargo test --release -p designtree-cli --test g3_corpus -- --ignored --nocapture | tee g3.log
      - name: Report the recall
        if: always()
        shell: bash
        run: |
          [ -f g3.log ] || exit 0
          {
            echo "### G3 seeded-error corpus (kernel $KERNEL_TAG, dt-schema $DTSCHEMA_VERSION)"
            grep '^G3:' g3.log || echo "The corpus did not finish."
            echo
            grep '^|' g3.log || true
            if grep -qE '^(MISS|ERROR)' g3.log; then
              echo
              echo '```'
              grep -E '^(MISS|ERROR|        )' g3.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
