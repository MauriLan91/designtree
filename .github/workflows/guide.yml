name: User guide

# Builds the mdBook user guide in docs/guide on every PR that touches the
# docs, and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/guide.yml]
  pull_request:
    paths: [docs/**, .github/workflows/guide.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        # mdBook reports a missing include as an error but still exits 0.
        run: |
          mdbook build docs/guide 2>&1 | tee build.log
          ! grep -q ERROR build.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
