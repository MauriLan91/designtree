name: Website

# Builds the site on every PR that touches it and publishes it to GitHub
# Pages from main: the landing page (site/) at the root, the mdBook user
# guide (docs/guide) under guide/.
on:
  push:
    branches: [main]
    paths: [docs/**, site/**, .github/workflows/guide.yml]
  pull_request:
    paths: [docs/**, site/**, .github/workflows/guide.yml]
  workflow_dispatch:

permissions:
  contents: read

# Pages takes one deployment at a time: two quick merges to main made the
# second deploy fail. Queue them instead, and never cancel a running one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" |
            tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build
        # mdBook reports a missing include as an error but still exits 0.
        run: |
          mdbook build docs/guide 2>&1 | tee build.log
          ! grep -q ERROR build.log
      - name: Assemble
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/guide/book _site/guide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
