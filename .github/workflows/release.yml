name: Release

# A pushed tag v<version> builds the Linux packages, installs each one in the
# distributions it targets, and attaches them to a draft release, to be
# checked and published by hand. DesignTree supports Linux only (US-12.1).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check the tag against the workspace version
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/bump-version.sh --check
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but the files say $cargo_version; run scripts/bump-version.sh $version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    needs: version
    uses: ./.github/workflows/linux-packages.yml
    with:
      arch-mode: release
      arch-ref: ${{ needs.version.outputs.version }}

  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance for every asset (US-12.2), checked with
      # `gh attestation verify <file> --repo MauriLan91/designtree`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changelog.sh reads the merges since the previous tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          # The PKGBUILD and .SRCINFO are the AUR files, not installers.
          find . -type f ! -name PKGBUILD ! -name .SRCINFO -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          mv .SRCINFO designtree.SRCINFO
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/*.pkg.tar.zst
            assets/*.deb
            assets/*.rpm
            assets/*.flatpak
            assets/*.AppImage
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section scripts/bump-version.sh wrote, else the same notes
          # generated now.
          awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md 2>/dev/null || true
          grep -q . notes.md || scripts/changelog.sh > notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "DesignTree $VERSION" --notes-file notes.md assets/*
