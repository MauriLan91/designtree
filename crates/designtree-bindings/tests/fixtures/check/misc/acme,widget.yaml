%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/acme,widget.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Acme widget

maintainers:
  - Nobody <nobody@example.com>

properties:
  compatible:
    enum:
      - acme,widget
      - acme,widget-v2

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

  acme,mode:
    description: Operating mode.
    $ref: /schemas/types.yaml#/definitions/string
    enum: [fast, slow]

  acme,gain:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 7

  acme,window:
    description: A 32- or 64-bit address window.
    oneOf:
      - $ref: /schemas/types.yaml#/definitions/uint32
      - $ref: /schemas/types.yaml#/definitions/uint64

patternProperties:
  "^port@[0-9a-f]+$":
    type: object
    properties:
      reg:
        maxItems: 1
      acme,lanes:
        $ref: /schemas/types.yaml#/definitions/uint32
        enum: [1, 2, 4]
    required:
      - reg
    additionalProperties: false

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: acme,widget-v2
    then:
      required:
        - acme,mode

additionalProperties: false

examples:
  - |
    widget@1000 {
        compatible = "acme,widget";
        reg = <0x1000 0x100>;
    };
