%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/acme,gadget.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Acme gadget

description:
  Refers to a property of another schema whose name starts with '#', with
  the '#' left unescaped, as kernel 7.2's mediatek,mt6577-sysirq.yaml does.

maintainers:
  - Nobody <nobody@example.com>

properties:
  compatible:
    const: acme,gadget

  reg:
    maxItems: 1

  "#size-cells":
    $ref: acme,widget.yaml#/properties/#size-cells

required:
  - compatible
  - reg

additionalProperties: false
