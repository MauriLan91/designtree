%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/example-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Example UART

properties:
  compatible:
    oneOf:
      - const: vendor,uart-a
      - items:
          - enum:
              - vendor,uart-b2
              - vendor,uart-b1
          - const: vendor,uart-b

  reg:
    maxItems: 1

  clocks:
    description: Reference clock.
    maxItems: 1

required:
  - compatible
  - reg
