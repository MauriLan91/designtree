%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: System Controller Devices

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - vendor,sysctrl-a
              - vendor,sysctrl-b
          - const: syscon
      - contains:
          const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg
